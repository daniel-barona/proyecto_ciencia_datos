name: Keep Alive Streamlit

on:
  schedule:
    # Cada 6 horas (00:00, 06:00, 12:00 y 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permitir ejecucion manual

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Abrir el sitio y mantener la sesion activa
        run: |
          python - <<'PY'
          import sys
          import time
          from playwright.sync_api import sync_playwright

          URL = "https://proyectocienciadatos-qmnztotitxxcstru4dsxrd.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()

              for intento in range(1, 4):
                  try:
                      respuesta = page.goto(URL, wait_until="networkidle", timeout=90000)
                      estado = respuesta.status if respuesta else None
                      print(f"Intento {intento}: HTTP {estado}")
                  except Exception as error:
                      print(f"Intento {intento}: error -> {error}")
                      page.wait_for_timeout(15000)
                      continue

                  if estado and 200 <= estado < 400:
                      # Mantener la sesion (websocket) activa unos segundos
                      page.wait_for_timeout(45000)
                      print("Sitio cargado y sesion mantenida correctamente.")
                      browser.close()
                      sys.exit(0)

                  page.wait_for_timeout(15000)

              browser.close()
              print("El sitio no respondio correctamente tras varios intentos.")
              sys.exit(1)
          PY
